; Firmware do conversor Buck - Black Pill (STM32F411CE)
;
; Um ambiente por modo de teste (ver README.md desta pasta):
;   d_fixo        PA8 com razao ciclica fixa (D_FIXO_PERMIL, em milesimos)
;   malha_aberta  PA8 com d[k] = vref[k]/E_NOM (Sinal 1 em malha aberta)
;
; Compilar:  pio run -e d_fixo
; Gravar:    pio run -e d_fixo -t upload            (ST-Link no conector SWD)
;            pio run -e d_fixo -t upload -O upload_protocol=dfu
;                                                    (USB-C: segurar BOOT0, apertar NRST, soltar BOOT0)
; Monitor:   pio device monitor -b 115200            (adaptador USB-serial no PA2)

[platformio]
default_envs = d_fixo

[env]
platform = ststm32
framework = cmsis
board = blackpill_f411ce
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:d_fixo]
build_flags = ${env.build_flags} -D MODO=MODO_D_FIXO -D D_FIXO_PERMIL=500

[env:malha_aberta]
build_flags = ${env.build_flags} -D MODO=MODO_MALHA_ABERTA
